<title>KARAFAKİ — design concept</title>
<script>
  // Static replacement for the locale redirect: pick the visitor's language, default German.
  (function () {
    var supported = ["de", "en", "tr"];
    var langs = navigator.languages || [navigator.language || ""];
    var pick = "de";
    for (var i = 0; i < langs.length; i++) {
      var l = String(langs[i]).toLowerCase().split("-")[0];
      if (supported.indexOf(l) !== -1) { pick = l; break; }
    }
    location.replace("/karafaki-concept/" + pick + "/" + location.hash);
  })();
</script>
